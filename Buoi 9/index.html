<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý sản phẩm</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 860px; margin: 30px auto; padding: 0 16px; }
    h1 { font-size: 24px; }
    form { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
    label { display: flex; flex-direction: column; font-size: 14px; gap: 4px; }
    input { padding: 6px 8px; }
    button { padding: 6px 12px; cursor: pointer; }
    fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
    img { width: 64px; height: 64px; object-fit: contain; }
    nav { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 8px; }
    th { background: #f2f2f2; }
    td.num { text-align: right; }
    .msg { padding: 8px 12px; margin-bottom: 12px; border-radius: 4px; }
    .error { background: #fdecea; color: #a61b1b; }
    .ok { background: #e7f6ea; color: #1d6b2f; }
  </style>
</head>
<body>
<div id="app">
  <h1>Quản lý sản phẩm</h1>

  <div v-if="message" class="msg" :class="isError ? 'error' : 'ok'">{{ message }}</div>

  <fieldset :disabled="busy">
  <form @submit.prevent="save">
    <label>Tên sản phẩm
      <input v-model="form.name" maxlength="100" required>
    </label>
    <label>Đơn giá
      <input v-model.number="form.price" type="number" min="1" step="1" required>
    </label>
    <label>Số lượng tồn
      <input v-model.number="form.stock" type="number" min="0" step="1" required>
    </label>
    <label>Ảnh sản phẩm
      <input ref="picker" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png" @change="selectImage">
    </label>
    <img v-if="preview || currentImage" :src="preview || currentImage" alt="Ảnh xem trước">
    <button type="submit">{{ editingId ? 'Lưu (sửa)' : 'Lưu (thêm)' }}</button>
    <button type="button" v-if="editingId" @click="resetForm">Hủy</button>
  </form>

  <table>
    <thead>
      <tr><th>Ảnh</th><th>Tên sản phẩm</th><th>Đơn giá (đồng)</th><th>Số lượng tồn</th><th>Thao tác</th></tr>
    </thead>
    <tbody>
      <tr v-for="p in products" :key="p.id">
        <td><img v-if="p.image" :src="p.image" :alt="p.name"><span v-else>Chưa có ảnh</span></td>
        <td>{{ p.name }}</td>
        <td class="num">{{ formatPrice(p.price) }}</td>
        <td class="num">{{ p.stock }}</td>
        <td>
          <button @click="edit(p)">Sửa</button>
          <button @click="remove(p)">Xóa</button>
        </td>
      </tr>
      <tr v-if="products.length === 0">
        <td colspan="5" style="text-align:center">Chưa có sản phẩm</td>
      </tr>
    </tbody>
  </table>
  <nav>
    <button :disabled="pagination.page <= 1" @click="changePage(pagination.page - 1)">Trước</button>
    <span>Trang {{ pagination.page }} / {{ pagination.total_pages }} — Tổng {{ pagination.total }} sản phẩm</span>
    <button :disabled="pagination.page >= pagination.total_pages" @click="changePage(pagination.page + 1)">Sau</button>
  </nav>
  </fieldset>
</div>

<script>
const API = 'api/products.php';

Vue.createApp({
  data() {
    return {
      products: [],
      pagination: { page: 1, total_pages: 1, total: 0 },
      busy: false,
      file: null,
      invalidFile: false,
      currentImage: '',
      preview: '',
      form: { name: '', price: '', stock: '' },
      editingId: null,
      message: '',
      isError: false
    };
  },
  mounted() {
    this.changePage(1);
  },
  methods: {
    async request(url, options = {}) {
      try {
        const res = await fetch(url, {
          headers: typeof options.body === 'string' ? { 'Content-Type': 'application/json' } : {},
          ...options
        });
        return await res.json();
      } catch (e) {
        return { success: false, message: 'Không kết nối được tới máy chủ.' };
      }
    },
    showMessage(text, error) {
      this.message = text;
      this.isError = error;
    },
    async changePage(page) {
      this.busy = true;
      try {
        await this.load(page);
      } finally {
        this.busy = false;
      }
    },
    async load(page = this.pagination.page) {
      const result = await this.request(`${API}?page=${page}&limit=5`);
      if (result.success) {
        this.products = result.data;
        this.pagination = result.pagination;
      } else {
        this.showMessage(result.message || 'Không tải được danh sách.', true);
      }
    },
    clearSelection() {
      if (this.preview) URL.revokeObjectURL(this.preview);
      this.file = null;
      this.preview = '';
      this.invalidFile = false;
    },
    selectImage(event) {
      this.clearSelection();
      const file = event.target.files[0];
      this.message = '';
      if (!file) return;
      if (!/\.(jpe?g|png)$/i.test(file.name) ||
          !['image/jpeg', 'image/png'].includes(file.type) || file.size > 2 * 1024 * 1024) {
        this.invalidFile = true;
        this.showMessage('Chọn ảnh JPG, JPEG hoặc PNG tối đa 2 MB.', true);
        return;
      }
      this.file = file;
      this.preview = URL.createObjectURL(file);
    },
    async save() {
      if (this.busy || this.invalidFile) return;
      this.busy = true;
      const page = this.editingId ? this.pagination.page : 1;
      try {
        const body = JSON.stringify(this.form);
        const result = this.editingId
          ? await this.request(`${API}?id=${this.editingId}`, { method: 'PUT', body })
          : await this.request(API, { method: 'POST', body });
        if (!result.success) {
          this.showMessage(result.message, true);
          return;
        }
        this.editingId = this.editingId || result.id;
        if (this.file) {
          const data = new FormData();
          data.append('id', this.editingId);
          data.append('image', this.file);
          const upload = await this.request('api/upload.php', { method: 'POST', body: data });
          if (!upload.success) {
            await this.load(page);
            this.showMessage('Đã lưu sản phẩm. ' + upload.message + ' Bấm Lưu để thử lại.', true);
            return;
          }
        }
        this.resetForm();
        this.showMessage(result.message, false);
        await this.load(page);
      } finally {
        this.busy = false;
      }
    },
    edit(p) {
      this.resetForm();
      this.editingId = p.id;
      this.currentImage = p.image;
      this.form = { name: p.name, price: p.price, stock: p.stock };
      this.message = '';
    },
    async remove(p) {
      if (!confirm(`Bạn có chắc muốn xóa "${p.name}"?`)) return;
      this.busy = true;
      const result = await this.request(`${API}?id=${p.id}`, { method: 'DELETE' });
      if (result.success) {
        this.showMessage(result.message, false);
        if (this.editingId === p.id) this.resetForm();
        await this.load();
      } else {
        this.showMessage(result.message || 'Có lỗi xảy ra.', true);
      }
      this.busy = false;
    },
    resetForm() {
      this.clearSelection();
      this.currentImage = '';
      this.$refs.picker.value = '';
      this.editingId = null;
      this.form = { name: '', price: '', stock: '' };
    },
    formatPrice(v) {
      return Number(v).toLocaleString('vi-VN');
    }
  }
}).mount('#app');
</script>
</body>
</html>
